name: CI

on:
  push:
    branches: [stable, dev]
    paths:
      - 'LastLogAudit.py'
      - 'scripts/**'
  pull_request:
    branches: [stable]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python syntax
        run: |
          python3 -m py_compile LastLogAudit.py
          python3 -m py_compile scripts/generate_samples.py
          echo "[+] All scripts compile OK."

  generate-samples:
    name: Regenerate samples
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if generate script changed
        id: check
        run: |
          if git diff --name-only HEAD~1 2>/dev/null | grep -q 'scripts/generate_samples.py'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate sample files
        if: steps.check.outputs.changed == 'true'
        run: python3 scripts/generate_samples.py

      - name: Verify samples parse correctly
        if: steps.check.outputs.changed == 'true'
        run: |
          for f in samples/*.lastlog; do
            echo "--- $f ---"
            python3 LastLogAudit.py -f "$f" -d line
          done
          echo "--- wtmp ---"
          python3 LastLogAudit.py --wtmp samples/compromised.wtmp -d line
          echo "--- auth.log ---"
          python3 LastLogAudit.py --auth-log samples/compromised.auth.log -d line

      - name: Commit updated samples
        if: steps.check.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config user.name "franckferman"
          git config user.email "franckferman@users.noreply.github.com"
          git add samples/
          if git diff --cached --quiet; then
            echo "[*] No changes to samples."
          else
            git commit -m "Regenerate sample files"
            git push
          fi
